[project]
name = "pov-backend"
version = "0.1.0"
description = "Generated FastAPI + Pydantic + MongoDB backend (poc-builder backend coding agent)."
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "pymongo>=4.13,<5",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pyright[nodejs]>=1.1.390",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9",
    "schemathesis>=4.0,<5",
]

[tool.uv]
package = false
